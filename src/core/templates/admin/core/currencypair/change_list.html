{% extends "admin/change_list.html" %}

{% block object-tools-items %}
<li>
  <form method="post" action="{% url 'admin:core_currencypair_refresh_drafts' %}" style="display:inline;">
    {% csrf_token %}
    <input type="submit" value="1. Подтянуть исконный API (ЦБ + Frankfurter)" class="default">
  </form>
</li>
<li>
  <form method="post" action="{% url 'admin:core_currencypair_accept_drafts' %}" style="display:inline;"
        onsubmit="return confirm('Коммерческий курс = исконный API × коэффициент для всех пар. Продолжить?');">
    {% csrf_token %}
    <input type="submit" value="2. Коммерческий = API × коэффициент" class="default">
  </form>
</li>
{{ block.super }}
{% endblock %}
