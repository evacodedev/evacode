upstream api {
    server server:8000;
}

# Docker's internal DNS resolver — allows lazy resolution of upstream hosts.
# Without this, nginx crashes on startup if a container isn't running yet.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTML from Nuxt must not stick in the browser after a frontend rebuild.
# Other types inherit no expires from this map (off).
map $sent_http_content_type $nuxt_expires {
    default off;
    ~*text/html epoch;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.evacode.org evacode.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.evacode.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evacode.org;

    ssl_certificate /etc/letsencrypt/live/www.evacode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.evacode.org/privkey.pem;

    return 301 https://www.evacode.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.evacode.org;

    ssl_certificate /etc/letsencrypt/live/www.evacode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.evacode.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /admin/ {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location /api/ {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location /media/ {
        alias /www/data/media/;
        expires 7d;
    }
    location /static/ {
        alias /www/data/static/;
        expires 7d;
    }
    location /_nuxt/ {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        expires $nuxt_expires;
    }
}
