# resolve: after `server` is recreated it may get a new IP; re-resolve via Docker DNS (resolver below).
upstream api {
    zone api 64k;
    server server:8000 resolve;
}

proxy_cache_path /var/cache/nginx/imgproxy levels=1:2 keys_zone=imgproxy:50m max_size=2g inactive=14d use_temp_path=off;

# Docker's internal DNS resolver — allows lazy resolution of upstream hosts.
# Without this, nginx crashes on startup if a container isn't running yet.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTML from Nuxt must not stick in the browser after a frontend rebuild.
# Other types inherit no expires from this map (off).
map $sent_http_content_type $nuxt_expires {
    default off;
    ~*text/html epoch;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.evacode.org evacode.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://evacode.co.kr$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name evacode.co.kr www.evacode.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://evacode.co.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evacode.org www.evacode.org;

    ssl_certificate /etc/letsencrypt/live/evacode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evacode.org/privkey.pem;

    # Partner clients drop Authorization on a cross-host redirect, so /api/ is served in place.
    include /etc/nginx/evacode-api.locations;

    location / {
        return 301 https://evacode.co.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.evacode.co.kr;

    ssl_certificate /etc/letsencrypt/live/evacode.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evacode.co.kr/privkey.pem;

    # Partner clients drop Authorization on a cross-host redirect, so /api/ is served in place.
    include /etc/nginx/evacode-api.locations;

    location / {
        return 301 https://evacode.co.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evacode.co.kr;

    ssl_certificate /etc/letsencrypt/live/evacode.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evacode.co.kr/privkey.pem;

    include /etc/nginx/evacode-site.locations;
}
