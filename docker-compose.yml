version: "3.8"

services:
  db:
    container_name: evacode-db
    image: postgres:latest
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    restart: always
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
  server:
    container_name: evacode-api
    build:
      context: .
      network: host
      dockerfile: dockerfiles/Dockerfile
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py createsuperuser --noinput & python manage.py create_currency & gunicorn evacode_backend.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60"
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - static:/www/data/static
      - media:/www/data/media
  update_database:
    container_name: update_database
    network_mode: "host"
    build:
      context: .
      network: host
      dockerfile: dockerfiles/Dockerfile
    command: sh -c "python manage.py updatedata"
    restart: always
    depends_on:
      - server
    env_file:
      - .env2
    volumes:
      - static:/www/data/static
      - media:/www/data/media
  kz_stock_sync:
    container_name: kz_stock_sync
    build:
      context: .
      network: host
      dockerfile: dockerfiles/Dockerfile
    command: python manage.py sync_kz_stock
    restart: always
    depends_on:
      - server
    env_file:
      - .env
    volumes:
      - static:/www/data/static
      - media:/www/data/media
  imgproxy:
    container_name: evacode-imgproxy
    image: darthsim/imgproxy:v3.27.1
    restart: always
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_ALLOWED_SOURCES: "https://a46291.business.ru/"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_QUALITY: "75"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_TTL: "2592000"
      IMGPROXY_DOWNLOAD_TIMEOUT: "15"
      IMGPROXY_READ_TIMEOUT: "15"
      IMGPROXY_WRITE_TIMEOUT: "15"
      IMGPROXY_MAX_SRC_FILE_SIZE: "20971520"
  nginx:
    container_name: evacode-nginx
    build: ./dockerfiles/nginx
    ports:
      - 443:443
      - 80:80
    depends_on:
      - server
      - imgproxy
    volumes:
      - static:/www/data/static
      - media:/www/data/media
      - imgcache:/var/cache/nginx/imgproxy
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
  # certbot: temporarily disabled — using purchased certificate until 2026-06-19 17:56 UTC
  # Re-enable after LE rate limit resets and run: bash init-letsencrypt.sh
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./data/certbot/conf:/etc/letsencrypt
  #     - ./data/certbot/www:/var/www/certbot
  #   entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
  frontend:
    build: evacode.org
    restart: always
    depends_on:
      - nginx
volumes:
  pgdata:
    name: evacode-pgdata
  static:
    name: evacode-static
  media:
    name: evacode-media
  imgcache:
    name: evacode-imgcache
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450
